name: Rahavahti CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test reference core
        run: npm test
      - name: Production build validation (not deployment)
        env:
          NEON_AUTH_BASE_URL: https://ci.example.invalid/rahavahti/auth
          NEON_AUTH_COOKIE_SECRET: ci-only-synthetic-secret-never-for-production-0000
          FINANCE_WRITES_ENABLED: 'false'
        run: npm run build
